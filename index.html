<style>

#place{font-size:13px;opacity:.7;text-align:center;padding:4px}

#menu.on{display:flex}
#menu button{background:none;border:none;color:#fff;text-align:left;padding:10px;font-size:15px;border-radius:8px}

#modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:18px}

.mBox{background:#121a2e;border-radius:18px;padding:20px;width:100%;max-width:420px}
#mTitle{font-size:19px;margin-bottom:8px}
#mText{opacity:.85;margin-bottom:14px;line-height:1.45}

<div id="intro" class="screen on">
  <canvas id="mapCanvas"></canvas>
  <div class="introBox">
    <h1>BİR HAYAT</h1>
    <p>Şu an dünyada her saniye ~4 bebek doğuyor.</p>
    <p>Sen hangisi olacaksın?</p>
    <div id="bornCount">0</div>
    <button class="btn" id="btnBorn">DOĞ</button><br><br>
    <input id="codeInput" placeholder="Hayat kodu (isteğe bağlı)"><br>

  </div>

<div id="slot" class="screen">

</div>

<div id="game" class="screen">

      <button data-s="0">⏸</button><button data-s="1" class="act">1x</button><button data-s="2">2x</button><button data-s="3">3x</button><button data-s="4">4x</button>
    </div>
    <button class="btn alt sm" id="menuBtn">☰</button>
  </div>
  <div id="avatarWrap"><div id="avatar">👶</div></div>
  <div id="place"></div>
  <div id="stats"></div>
  <div id="story"></div>
  <div id="menu"></div>
</div>

<div id="modal"><div class="mBox"><div id="mTitle"></div><div id="mText"></div><div id="mChoices"></div></div></div>

<div id="end" class="screen"><div id="endCard"></div></div>

<script>

// ===== 2. KISIM: VERİ + MOTOR =====
// Kur ve maaşlar yaklaşık değerlerdir, istediğin zaman güncelleyebilirsin.
const COUNTRIES=[
 {n:"Hindistan",cur:"₹",cn:"rupi",tl:0.48,w:17,life:72,sal:30000,rent:9000,food:7000,own:0.6,war:0.01,quake:0.02,

  cities:["Kahire","İskenderiye"],rural:0.57,rel:[["Müslüman",0.9],["Hristiyan",0.1]]},
 {n:"Brezilya",cur:"R$",cn:"real",tl:7.8,w:2,life:76,sal:3200,rent:1500,food:900,own:0.7,war:0.002,quake:0.001,
  cities:["São Paulo","Rio de Janeiro","Salvador"],rural:0.13,rel:[["Hristiyan",0.86],["Dinsiz",0.1],["Diğer",0.04]]},
 {n:"ABD",cur:"$",cn:"dolar",tl:42,w:2.7,life:78,sal:5000,rent:1700,food:600,own:0.65,war:0.002,quake:0.01,
  cities:["New York","Los Angeles","Chicago","Houston"],rural:0.17,rel:[["Hristiyan",0.63],["Dinsiz",0.29],["Diğer",0.08]]},
 {n:"Türkiye",cur:"₺",cn:"lira",tl:1,w:1,life:77,sal:35000,rent:15000,food:12000,own:0.57,war:0.005,quake:0.06,
  cities:["İstanbul","Ankara","İzmir","Diyarbakır"],rural:0.24,rel:[["Müslüman",0.95],["Dinsiz",0.04],["Diğer",0.01]]},
 {n:"Almanya",cur:"€",cn:"euro",tl:48,w:0.6,life:81,sal:3500,rent:1000,food:450,own:0.47,war:0.001,quake:0.001,
  cities:["Berlin","Münih","Hamburg"],rural:0.22,rel:[["Hristiyan",0.5],["Dinsiz",0.43],["Müslüman",0.06],["Diğer",0.01]]},
 {n:"Japonya",cur:"¥",cn:"yen",tl:0.28,w:0.6,life:84,sal:330000,rent:90000,food:50000,own:0.61,war:0.001,quake:0.08,
  cities:["Tokyo","Osaka","Sapporo"],rural:0.08,rel:[["Şinto/Budist",0.7],["Dinsiz",0.27],["Hristiyan",0.03]]}
];
const JOBS_PARENT=[["Çiftçi",0.5],["İşçi",0.8],["Esnaf",1],["Öğretmen",1.1],["Hemşire",1.1],["Mühendis",1.8],["Doktor",2.5],["İşsiz",0.15],["Ev hanımı",0]];
const NAMES={E:["Ali","Rahul","Wei","Chinedu","Ahmed","Lucas","James","Kenji","Mehmet","Yusuf","Arjun","Jonas"],K:["Ayşe","Priya","Mei","Amaka","Fatima","Ana","Emma","Yuki","Zeynep","Meryem","Sara","Lena"]};

// ===== Tohumlu rastgele (hayat kodu) =====
let seed=Date.now()%100000;
function setSeed(s){seed=s>>>0}
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function ri(a,b){return Math.floor(rnd()*(b-a+1))+a}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function wpick(list){let s=list.reduce((x,i)=>x+i[1],0),r=rnd()*s;for(const i of list){r-=i[1];if(r<=0)return i[0]}return list[0][0]}
function codeToSeed(c){let h=0;for(const ch of c.toUpperCase())h=(h*31+ch.charCodeAt(0))>>>0;return h}
function dailyCode(){const d=new Date();return "GUN"+d.getFullYear()+(d.getMonth()+1)+d.getDate()}
function randCode(){const c="ABCDEFGHJKLMNPRSTUVYZ23456789";let s="";for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s}

// ===== Oyun durumu =====
let S=null, speed=1, timer=null, yearProg=0, paused=false;
const YEAR_MS=40000; // 1x hızda bir yıl 40 saniye

function newLife(code){
  setSeed(codeToSeed(code));
  const C=wpick(COUNTRIES.map(c=>[c,c.w]));
  const rural=rnd()<C.rural;
  const g=rnd()<0.51?"E":"K";
  const pj=[wpick(JOBS_PARENT),wpick(JOBS_PARENT)];
  const pMult=(JOBS_PARENT.find(j=>j[0]==pj[0])[1]+JOBS_PARENT.find(j=>j[0]==pj[1])[1])/2;
  S={code,c:C.n,city:rural?pick(C.cities)+" yakınında bir köy":pick(C.cities),rural,g,name:pick(NAMES[g]),
    rel:wpick(C.rel),age:0,money:0,familyMoney:Math.round(C.sal*pMult*(rural?6:12)),
    health:rural?65:75,smart:ri(30,80),happy:60,social:40,
    parents:{dad:pj[0],mom:pj[1],dadAlive:true,momAlive:true,home:rnd()<C.own?"kendi evleri":"kirada"},
    siblings:ri(0,rural?5:2),edu:"yok",school:false,job:null,salary:0,partner:null,kids:0,
    debt:0,loanRate:0,invest:0,smoke:false,group:null,flags:{},delayed:[],log:[],badges:[],dead:false,cause:""};
  return S;
}
function C(){return COUNTRIES.find(c=>c.n==S.c)}

// ===== Para gösterimi =====
function fmt(v){return Math.round(v).toLocaleString("tr-TR")}
function moneyStr(v){const c=C();return c.cur+" "+fmt(v)+(c.tl!=1?"  (≈ ₺"+fmt(v*c.tl)+")":"")}

// ===== Sayı yerine açıklama =====
function dHealth(h){return h>85?"Turp gibi":h>65?"Sağlıklı":h>45?"Sık hastalanıyor":h>25?"Ciddi sorunlar var":"Çok kötü"}
function dSmart(s){return s>85?"Parlak zekâ":s>65?"Zeki":s>45?"Ortalama":s>25?"Zorlanıyor":"Çok zorlanıyor"}
function dHappy(h){return h>80?"Mutlu":h>60?"Keyfi yerinde":h>40?"Eh işte":h>20?"Mutsuz":"Çok mutsuz"}
function dSocial(s){return s>75?"Çok arkadaşı var":s>50?"Birkaç yakın dostu var":s>25?"Az arkadaşı var":"Yalnız"}
function clamp(){for(const k of["health","smart","happy","social"])S[k]=Math.max(0,Math.min(100,S[k]))}

// ===== Gecikmeli sonuçlar (ör. sigara yıllar sonra) =====
function later(years,fn,text){S.delayed.push({at:S.age+years,fn,text})}
function runDelayed(){
  S.delayed=S.delayed.filter(d=>{
    if(S.age>=d.at){ if(DELAYED_FX[d.fn])DELAYED_FX[d.fn](); if(d.text)log(d.text,"bad"); return false }
    return true });
}
const DELAYED_FX={
  smokeSick(){S.health-=25;S.flags.lung=true},
  studyPay(){S.smart+=5;S.salary=Math.round(S.salary*1.2)},
  friendHelp(){S.money+=C().sal*2;S.happy+=10},
  badCrowd(){S.health-=10;S.happy-=10}
};

// ===== Hikaye satırı =====
function log(t,cls){S.log.push({t,cls:cls||""});if(typeof renderStory=="function")renderStory()}

// ===== Bir yıl geçtiğinde =====
function yearPassed(){
  if(S.dead)return;
  S.age++;
  const c=C();
  log("🎂 "+S.age+" yaşına girdin.","y");
  // Gelir-gider
  if(S.age>=18){
    const inc=S.salary*12, cost=(S.rent0?0:c.rent*12)+c.food*12*(1+S.kids*0.5);
    S.money+=inc-cost;
    if(S.invest>0){const r=(rnd()*0.3-0.08);const gain=S.invest*r;S.invest+=gain;
      if(Math.abs(gain)>c.sal)log(gain>0?"📈 Yatırımın kazandırdı: +"+moneyStr(gain):"📉 Yatırımın değer kaybetti: "+moneyStr(gain),gain>0?"good":"bad")}
    if(S.debt>0){S.debt*=1+S.loanRate;const pay=Math.min(S.debt,Math.max(0,S.money*0.3));S.debt-=pay;S.money-=pay}
    if(S.money<0&&S.debt==0){S.happy-=8;log("Ay sonunu getiremiyorsun, borç birikiyor.","bad")}
  }
  // Yaşlanma ve sağlık
  if(S.age>40)S.health-=ri(0,2)+(S.age>65?2:0);
  if(S.smoke)S.health-=1;
  if(S.rural&&S.age<5&&rnd()<0.02*(100-c.life)/20){S.health-=20;log("Ağır bir hastalık geçirdin; köyde doktor yoktu.","bad")}
  // Anne-baba vefatı
  const pa=S.age+25;
  if(S.parents.dadAlive&&rnd()<Math.max(0,(pa-c.life+15))/60){S.parents.dadAlive=false;S.happy-=20;log("🕯️ Baban vefat etti.","bad")}
  if(S.parents.momAlive&&rnd()<Math.max(0,(pa-c.life+10))/60){S.parents.momAlive=false;S.happy-=20;log("🕯️ Annen vefat etti.","bad")}
  // Dünya olayları
  if(rnd()<c.war){S.health-=15;S.money*=0.6;S.happy-=20;log("⚔️ Ülkende çatışma çıktı. Her şey değişti.","bad")}
  if(rnd()<c.quake){const d=ri(5,30);S.health-=d;S.money*=0.8;log("🌍 Deprem oldu. "+(d>20?"Evin yıkıldı.":"Korkuyla atlattın."),"bad")}
  if(rnd()<0.03){S.money*=0.85;log("💸 Ekonomik kriz: fiyatlar uçtu, birikimin eridi.","bad")}
  runDelayed();
  clamp();
  // Ölüm kontrolü
  const risk=(S.health<10?0.4:0)+Math.max(0,(S.age-c.life+5))*0.02+(S.age<5?(100-c.life)/400:0);
  if(rnd()<risk){endLife(S.health<10?"hastalık":"yaşlılık");return}
  // Seçimli olay
  const ev=pickEvent();
  if(ev)showEvent(ev);
  save();renderAll();
}

// ===== Zaman döngüsü =====
function startLoop(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(paused||speed==0||S.dead||document.getElementById("modal").classList.contains("on"))return;
    yearProg+=100*speed;
    if(yearProg>=YEAR_MS){yearProg=0;yearPassed()}
  },100);
}

// ===== Kayıt =====
function save(){try{localStorage.setItem("birHayat",JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("birHayat"))}catch(e){return null}}

// ===== 3. KISIM: OLAYLAR + EKRAN =====
const $=id=>document.getElementById(id);
const sal=()=>C().sal;
function ev(o){return o}
const EVENTS=[

  ["Vermem!",()=>{S.happy+=3;S.social-=5;log("Oyuncağını vermedin, o çocuk seninle konuşmadı.")}]]}),

  ["Aileme yardım edeyim",()=>{S.familyMoney+=sal()*2;S.smart-=10;log("Okul yerine tarlada/dükkânda çalıştın.","bad")}]]}),

  ["Ders çalışırım",()=>{S.smart+=7;later(12,"studyPay");log("Sınavdan yüksek aldın.","good")}],
  ["Oyuna giderim",()=>{S.happy+=6;S.social+=5;S.smart-=3;log("Çok eğlendin ama sınav kötü geçti.")}]]}),
 ev({id:"group",min:11,max:13,title:"Arkadaş grubu",text:"Okulda/mahallede kiminle takılacaksın?",ch:[
  ["Çalışkan grup",()=>{S.group="calis";S.smart+=5;log("Çalışkan bir grupla arkadaş oldun.")}],
  ["Eğlenceli grup",()=>{S.group="eglen";S.social+=10;S.happy+=5;log("Eğlenceli, biraz da başı belalı bir grup.")}],
  ["Tek başıma",()=>{S.group="yalniz";S.social-=10;S.smart+=3;log("Kendi başına kaldın, kitaplara gömüldün.")}]]}),
 ev({id:"smoke",min:14,max:17,cond:()=>S.group=="eglen",title:"Sigara teklifi",text:"Gruptan biri sana sigara uzatıyor: \"Herkes içiyor.\"",ch:[
  ["Alırım",()=>{S.smoke=true;S.social+=4;later(ri(18,28),"smokeSick","Yıllardır içtiğin sigara akciğerlerini vurdu.");log("İlk sigaranı içtin. Şimdilik bir şey olmadı...")}],
  ["Hayır",()=>{S.social-=4;log("Reddettin, biraz dışlandın ama sağlığını korudun.","good")}]]}),
 ev({id:"crowdTrouble",min:15,max:18,cond:()=>S.group=="eglen",title:"Gece yarısı",text:"Grup gece izinsiz bir partiye gitmek istiyor.",ch:[
  ["Giderim",()=>{S.happy+=5;if(rnd()<0.4){later(3,"badCrowd");log("Parti kavgayla bitti, başın derde girdi.","bad")}else log("Unutulmaz bir geceydi.","good")}],
  ["Evde kalırım",()=>{S.social-=3;log("Evde kaldın, ertesi gün herkes başka konuşuyordu.")}]]}),
 ev({id:"olymp",min:14,max:17,cond:()=>S.group=="calis",title:"Yarışma",text:"Öğretmenin seni bir bilim yarışmasına önerdi.",ch:[
  ["Katılırım",()=>{if(S.smart>60){S.flags.award=true;S.smart+=5;log("🏅 Yarışmada derece aldın!","good")}else log("Elendin ama çok şey öğrendin.")}],
  ["Uğraşamam",()=>{log("Fırsatı geri çevirdin.")}]]}),
 ev({id:"crush",min:14,max:19,title:"Kalp çarpıntısı",text:"Biri dikkatini çekiyor, her gördüğünde heyecanlanıyorsun.",ch:[
  ["Konuşmaya giderim",()=>{if(rnd()<0.5+S.social/200){S.happy+=12;S.flags.firstLove=true;log("❤️ Seni o da beğeniyormuş!","good")}else{S.happy-=8;log("Kibarca reddedildin. Acıttı.","bad")}}],
  ["Uzaktan bakarım",()=>{S.happy-=2;log("Hiç açılmadın, yıllarca 'ya söyleseydim' diye düşündün.")}]]}),
 ev({id:"uni",min:17,max:19,cond:()=>S.school,title:"Okul mu iş mi?",text:"Liseyi bitiriyorsun. Ne yapacaksın?",ch:[
  ["Üniversite",()=>{if(S.smart<45){log("Sınavı kazanamadın.","bad");return}
    if(S.smart>75&&rnd()<0.6){S.flags.burs=true;log("🎓 Burs kazandın!","good")}else S.familyMoney-=sal()*8;S.edu="üniversite";S.flags.uniEnd=S.age+4;log("Üniversiteye başladın.","good")}],
  ["Çalışmaya başla",()=>{S.edu="lise";log("Okulu bırakıp iş aramaya başladın.")}]]}),
 ev({id:"job",min:18,max:60,repeat:true,cond:()=>!S.job&&(!S.flags.uniEnd||S.age>=S.flags.uniEnd),title:"Meslek seçimi",text:"Hangi işi seçeceksin?",chf:()=>{
   const u=S.edu=="üniversite",o=[["Garson / işçi",0.6],["Satış elemanı",0.8],["Şoför",0.9]];
   if(u)o.push(["Öğretmen",1.1],["Mühendis",1.8],["Yazılımcı",2],["Doktor",2.6]);
   if(S.smart>70&&u)o.push(["Kendi şirketim",rnd()<0.3?4:0.4]);
   return o.map(j=>[j[0]+" (~"+moneyStr(sal()*j[1])+"/ay)",()=>{S.job=j[0];S.salary=Math.round(sal()*j[1]*(0.85+rnd()*0.3));log("💼 "+j[0]+" olarak çalışmaya başladın.","good")}])}}),
 ev({id:"meet",min:20,max:45,repeat:true,cond:()=>!S.partner,chance:0.35,title:"Biriyle tanıştın",text:"Bir ortamda biriyle uzun uzun sohbet ettin.",ch:[
  ["Numarasını isterim",()=>{if(rnd()<0.6){S.partner={name:pick(NAMES[S.g=="E"?"K":"E"]),yrs:0,married:false};S.happy+=10;log("❤️ "+S.partner.name+" ile çıkmaya başladın.","good")}else log("Numara verdi ama hiç dönmedi.")}],
  ["Bir şey yapmam",()=>{log("Gece bitti, bir daha görmedin.")}]]}),
 ev({id:"marry",min:21,max:55,repeat:true,cond:()=>S.partner&&!S.partner.married,chance:0.4,title:"Evlilik",text:()=>S.partner.name+" ile ciddi düşünüyorsunuz. Düğün masrafı ~"+moneyStr(sal()*6),ch:[
  ["Evlenelim",()=>{S.money-=sal()*6;S.partner.married=true;S.happy+=15;log("💍 "+S.partner.name+" ile evlendin.","good")}],
  ["Henüz değil",()=>{if(rnd()<0.3){log(S.partner.name+" beklemekten yoruldu, ayrıldınız.","bad");S.partner=null;S.happy-=15}}],]}),
 ev({id:"kid",min:23,max:44,repeat:true,cond:()=>S.partner&&S.partner.married&&S.kids<4,chance:0.3,title:"Çocuk",text:"Bir çocuk sahibi olmak ister misiniz? Masraflar artar.",ch:[
  ["Evet",()=>{S.kids++;S.happy+=12;log("👶 Bir çocuğun oldu!","good")}],
  ["Şimdi değil",()=>{}]]}),
 ev({id:"sick",min:5,max:110,repeat:true,chance:0.12,title:"Hastalık",text:()=>"Ciddi bir rahatsızlık. Tedavi: "+moneyStr(sal()*4),ch:[
  ["Tedavi olurum",()=>{const t=sal()*4;if(S.age<18){S.familyMoney-=t;S.health+=5;log("Ailen tedavini karşıladı.");return}
    if(S.money>=t){S.money-=t;S.health+=5;log("Tedavi oldun, iyileştin.","good")}else{S.debt+=t;S.loanRate=0.3;S.health+=5;log("Parası yetmedi, faizli kredi çektin.","bad")}}],
  ["Arkadaştan borç",()=>{if(S.social>50){S.health+=5;S.flags.owe=true;log("Bir dostun yardım etti.","good")}else{S.health-=15;log("Kimse yardım edemedi, tedavisiz kaldın.","bad")}}],
  ["Tedavi olmam",()=>{S.health-=20;log("Tedavi olmadın; vücudun yıprandı.","bad")}]]}),
 ev({id:"retire",min:60,max:68,cond:()=>S.job,title:"Emeklilik",text:"Emekli olma vaktin geldi mi?",ch:[
  ["Emekli olurum",()=>{S.salary=Math.round(S.salary*0.5);S.happy+=10;S.job="Emekli";log("Emekli oldun.","good")}],
  ["Çalışmaya devam",()=>{S.health-=5;S.money+=sal()*6;log("Çalışmaya devam ettin.")}]]})
];
function pickEvent(){
  const ok=EVENTS.filter(e=>S.age>=e.min&&S.age<=e.max&&(e.repeat||!S.flags["ev_"+e.id])&&(!e.cond||e.cond())&&(!e.chance||rnd()<e.chance));
  const must=ok.filter(e=>!e.repeat&&S.age==e.max);
  return must[0]||(ok.length?pick(ok):null);
}
function showEvent(e){
  S.flags["ev_"+e.id]=true;
  $("mTitle").textContent=e.title;
  $("mText").textContent=typeof e.text=="function"?e.text():e.text;
  const ch=e.chf?e.chf():e.ch;$("mChoices").innerHTML="";
  ch.forEach(c=>{const b=document.createElement("button");b.textContent=c[0];
    b.onclick=()=>{c[1]();clamp();$("modal").classList.remove("on");save();renderAll()};$("mChoices").appendChild(b)});
  $("modal").classList.add("on");
}

// ===== Üst menü =====
const MENU=[
 ["❤️ Sağlığına yatırım",()=>sal()*1,()=>{S.health+=8;log("Spora ve check-up'a para harcadın.","good")}],
 ["📚 Kendine yatırım (kurs)",()=>sal()*1.5,()=>{S.smart+=6;if(S.salary)S.salary=Math.round(S.salary*1.05);log("Bir kurs bitirdin.","good")}],
 ["👨‍👩‍👧 Sevdiklerinle vakit",()=>sal()*0.5,()=>{S.happy+=8;S.social+=6;log("Sevdiklerinle güzel bir gün geçirdin.","good")}],
 ["🤲 Bağış / zekât",()=>Math.max(S.money*0.025,sal()*0.2),()=>{S.happy+=6;S.flags.donor=true;log("İhtiyacı olanlara bağış yaptın.","good")}],
 ["📈 Birikimini yatır",()=>S.money*0.5,()=>{},a=>{S.invest+=a;log("Birikiminin yarısını yatırıma koydun.")}],
 ["🏦 Banka kredisi",()=>0,()=>{const k=sal()*10;S.money+=k;S.debt+=k;S.loanRate=0.3;log("Faizli kredi çektin: "+moneyStr(k),"bad")}],
 ["🚭 Sigarayı bırak",()=>0,()=>{if(!S.smoke)return log("Zaten içmiyorsun.");S.smoke=false;S.delayed=S.delayed.filter(d=>d.fn!="smokeSick"||rnd()<0.4);log("Sigarayı bıraktın!","good")}],
 ["🔑 Hayat kodum",()=>0,()=>alert("Hayat kodun: "+S.code+"\nArkadaşın bu kodla aynı başlangıçla oynayabilir.")]
];
function buildMenu(){$("menu").innerHTML="";MENU.forEach(m=>{const b=document.createElement("button");
  const cost=m[1]();b.textContent=m[0]+(cost>0?" · "+C().cur+fmt(cost):"");
  b.onclick=()=>{const c=m[1]();if(S.age<18&&c>0&&m[0].indexOf("Hayat")<0){alert("Bunun için 18 yaşını bekle.");return}
    if(c>S.money){alert("Paran yetmiyor.");return}S.money-=c;m[2]();if(m[3])m[3](c);clamp();$("menu").classList.remove("on");save();renderAll()};
  $("menu").appendChild(b)})}
$("menuBtn").onclick=()=>{buildMenu();$("menu").classList.toggle("on")};

// ===== Ekran çizimi =====
function avatar(){const a=S.age,e=S.g=="E";return a<3?"👶":a<13?(e?"👦":"👧"):a<30?(e?"🧑":"👩"):a<60?(e?"👨":"👩"):(e?"👴":"👵")}
function renderStory(){$("story").innerHTML=S.log.slice(-60).map(l=>"<p class='"+l.cls+"'>"+l.t+"</p>").reverse().join("")}
function renderAll(){
  $("age").textContent=S.name+" · "+S.age+" yaş";
  $("money").textContent=S.age<18?"Ailenin: "+moneyStr(S.familyMoney):moneyStr(S.money);
  $("moneyTL").textContent=S.debt>0?"Borç: "+moneyStr(S.debt):"";
  $("avatar").textContent=avatar();$("avatar").style.fontSize=Math.min(50+S.age*2,110)+"px";
  $("place").textContent=S.city+", "+S.c+" · "+(S.job||S.edu);
  $("stats").innerHTML=[["Sağlık",dHealth(S.health)],["Zekâ",dSmart(S.smart)],["Mutluluk",dHappy(S.happy)],["Sosyal",dSocial(S.social)]]
    .map(s=>"<div><span>"+s[0]+"</span>"+s[1]+"</div>").join("");
  renderStory();
}
document.querySelectorAll("#speedBtns button").forEach(b=>b.onclick=()=>{speed=+b.dataset.s;
  document.querySelectorAll("#speedBtns button").forEach(x=>x.classList.remove("act"));b.classList.add("act")});

// ===== Hayat sonu =====
function endLife(cause){
  S.dead=true;S.cause=cause;clearInterval(timer);localStorage.removeItem("birHayat");
  const c=C(),b=[];
  if(S.age>c.life)b.push("🧓 Ortalamadan uzun");if(S.flags.award)b.push("🏅 Yarışma derecesi");
  if(S.flags.burs)b.push("🎓 Burslu");if(S.flags.donor)b.push("🤲 Cömert");if(S.kids>=2)b.push("👨‍👩‍👧 Kalabalık aile");
  if(S.money>c.sal*100)b.push("💰 Varlıklı");if(!S.smoke&&S.group=="eglen")b.push("🚭 Hayır diyebilen");
  $("endCard").innerHTML="<h2>"+S.name+" ("+S.age+")</h2>"+S.city+", "+S.c+"<br>"+S.rel+" · "+(S.job||S.edu)+
   "<br><br>Ölüm nedeni: "+cause+"<br>Ülke ortalaması: "+c.life+" yıl — sen "+(S.age>=c.life?"<b style='color:#06d6a0'>"+(S.age-c.life)+" yıl fazla</b>":"<b style='color:#ef476f'>"+(c.life-S.age)+" yıl az</b>")+" yaşadın"+
   "<br>Geride bıraktığın: "+moneyStr(S.money+S.invest-S.debt)+"<br>Çocuk: "+S.kids+
   "<br><br>"+b.map(x=>"<span class='badge'>"+x+"</span>").join("")+
   "<br><br>Hayat kodu: <b>"+S.code+"</b><br><br><button class='btn' onclick='location.reload()'>Yeniden Doğ</button>";
  $("game").classList.remove("on");$("end").classList.add("on");
}

// ===== Giriş: noktalı dünya haritası =====
const MAP=["......................................................",
"....####.......####...........######.#######..........",
"..########....###.............##############.######...",
".###########...#.............####################.....",
"..##########..................###################.....",
"....#######..................#####################....",
".....#####...................##.#################.....",
"......####...................####..############.......",
".......###..................#######...#######..##.....",
"........##.#####............########...####....##.....",
"..........#######............#######....##......#.....",
"..........########............#####.............###...",
"...........######.............####.............#####..",
"...........#####..............###...............####..",
"............###................#......................",
"............##........................................"];
function drawMap(){
  const cv=$("mapCanvas"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=MAP[0].length,rows=MAP.length,cw=cv.width/cols,chh=cv.height*0.6/rows,oy=cv.height*0.08;const dots=[];
  MAP.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch=="#")dots.push([i*cw+cw/2,oy+j*chh+chh/2])}));
  let n=Math.floor(rnd()*1000);
  setInterval(()=>{if(!$("intro").classList.contains("on"))return;
    x.fillStyle="#0b0f1a";x.fillRect(0,0,cv.width,cv.height);
    dots.forEach(d=>{x.fillStyle="#33415f";x.beginPath();x.arc(d[0],d[1],2,0,7);x.fill()});
    for(let k=0;k<4;k++){const d=dots[Math.floor(Math.random()*dots.length)];x.fillStyle="#ffd166";x.beginPath();x.arc(d[0],d[1],4,0,7);x.fill()}
    n+=Math.random()<0.5?1:0;$("bornCount").textContent=fmt(n)+" bebek doğdu";},250);
}

// ===== Slot animasyonu ve başlangıç =====
function spin(el,list,final,ms){return new Promise(r=>{const t=setInterval(()=>el.textContent=list[Math.floor(Math.random()*list.length)],70);
  setTimeout(()=>{clearInterval(t);el.textContent=final;r()},ms)})}
async function startLife(code){
  newLife(code);$("intro").classList.remove("on");$("slot").classList.add("on");
  await spin($("slotCountry"),COUNTRIES.map(c=>c.n),S.c,2200);
  await spin($("slotCity"),C().cities.concat(["Köy"]),S.city,1500);
  await spin($("slotGender"),["Erkek","Kız"],S.g=="E"?"Erkek":"Kız",900);
  $("slotFamily").textContent="Baba: "+S.parents.dad+" · Anne: "+S.parents.mom+" · "+S.parents.home+" · "+S.siblings+" kardeş";
  setTimeout(()=>{$("slot").classList.remove("on");$("game").classList.add("on");
    log("👶 "+S.city+", "+S.c+"'de "+(S.g=="E"?"bir erkek":"bir kız")+" bebek olarak doğdun. Adın "+S.name+".","y");
    log("Ailen "+S.rel.toLowerCase()+". Babanın işi: "+S.parents.dad+", annenin: "+S.parents.mom+". "+S.parents.home+" yaşıyorsunuz.");
    renderAll();startLoop()},2500);
}
$("btnBorn").onclick=()=>startLife(($("codeInput").value.trim()||randCode()).toUpperCase());
$("btnDaily").onclick=()=>startLife(dailyCode());
const saved=load();
if(saved&&!saved.dead){$("btnContinue").style.display="inline-block";
  $("btnContinue").onclick=()=>{S=saved;$("intro").classList.remove("on");$("game").classList.add("on");renderAll();startLoop();
    const e=EVENTS.find(v=>S.flags["ev_"+v.id]&&false);}}
drawMap();
</script>
